<h2>Product Details</h2>

<img [src]="productImage" width="200" height="200" />

<h3>{{productName}}</h3>
<p>{{productDescription}}</p>
<p>Price: ${{productPrice}}</p>
<p>Discount: {{discountPercentage}}%</p>
<p>Status: {{isAvailable ? "Available" : "Unavailable"}}</p>

<p>
  Quantity:
  <button [disabled]="!isAvailable" (click)="decreaseQuantity()">-</button>
  {{quantity}}
  <button [disabled]="!isAvailable" (click)="increaseQuantity()">+</button>
</p>

<p>Total after discount: ${{getFinalPrice()}}</p>
