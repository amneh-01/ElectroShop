<h1>ElectroShop</h1>

<div class="buttons">

  <button (click)="showFirstProduct()">
    Laptop
  </button>

  <button (click)="showSecondProduct()">
    Wireless Headphones
  </button>

</div>

<hr>

<app-product-details
  [productName]="productName()"
  [productDescription]="productDescription()"
  [productPrice]="productPrice()"
  [productAvailability]="productAvailability()"
  (addToCart)="addToCart($event)">
</app-product-details>

<hr>

<app-shopping-cart
  [cart]="cart()">
</app-shopping-cart>
